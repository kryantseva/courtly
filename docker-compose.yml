services:
  db:
    image: postgres:16-alpine
    container_name: courtly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courtly}
      POSTGRES_USER: ${POSTGRES_USER:-courtly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtly}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: courtly-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: courtly-frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_USE_API=${VITE_USE_API:-true}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
